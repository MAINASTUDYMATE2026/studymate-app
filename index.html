<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studymate - Your Personal Study Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .creator {
            font-size: 18px;
            color: #555;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .creator-name {
            color: #667eea;
            font-weight: 700;
        }

        .tagline {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature {
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }

        .cta-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
                border-radius: 16px;
            }

            .title {
                font-size: 36px;
            }

            .logo {
                font-size: 48px;
            }

            .creator {
                font-size: 16px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .cta-button {
                padding: 12px 30px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1 class="title">Studymate</h1>
        <p class="creator">Created by <span class="creator-name">BRIAN MAINA</span></p>
        
        <p class="tagline">
            Your personal study companion designed to help you learn, revise, practice questions, and organize your studies effectively.
        </p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎓</div>
                <div class="feature-text">Learn</div>
            </div>
            <div class="feature">
                <div class="feature-icon">✏️</div>
                <div class="feature-text">Revise</div>
            </div>
            <div class="feature">
                <div class="feature-icon">❓</div>
                <div class="feature-text">Practice</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📋</div>
                <div class="feature-text">Organize</div>
            </div>
        </div>

        <button class="cta-button">Get Started</button>

        <footer>
            <p>&copy; 2026 Studymate. All rights reserved. | MIT License</p>
        </footer>
    </div>
</body>
</html>
